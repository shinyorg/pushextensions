name: Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
  push:
    branches:
    - main
    - dev
    - preview
    - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
          fetch-depth: 0   # required by Nerdbank.GitVersioning

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v5
      with:
          dotnet-version: '10.0.x'

    - name: Build
      run: dotnet build ServerPush.slnx /restore -m -property:Configuration=Release -property:PublicRelease=true

    - name: Test
      run: dotnet test ./tests/Shiny.Extensions.Push.Tests/Shiny.Extensions.Push.Tests.csproj -c Release --no-build --nologo --no-restore --verbosity normal -l "trx;LogFilePrefix=testresults" --collect "XPlat Code Coverage" --logger GitHubActions

    - name: Post NuGet Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-artifacts
        path: '**/*.nupkg'
        retention-days: 5

    - name: Publish NuGets
      if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/v') }}
      run: dotnet nuget push "**/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGETAPIKEY }} --skip-duplicate
