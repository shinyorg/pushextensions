name: Sync Skills to Skills Repository

on:
  push:
    branches:
      - main
    paths:
      - 'skills/**'
  workflow_dispatch:

jobs:
  sync-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout skills repository
        uses: actions/checkout@v4
        with:
          repository: shinyorg/skills
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync skills directory
        run: |
          mkdir -p skills-repo/skills

          # Remove this repo's skills from the target first so renames/deletions sync cleanly.
          for skill_dir in source/skills/*/; do
            if [ -d "$skill_dir" ]; then
              skill_name=$(basename "$skill_dir")
              rm -rf "skills-repo/skills/$skill_name"
            fi
          done

          # Copy all skills from source
          for skill_dir in source/skills/*/; do
            if [ -d "$skill_dir" ]; then
              skill_name=$(basename "$skill_dir")
              cp -r "$skill_dir" "skills-repo/skills/$skill_name"
            fi
          done

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SKILLS_REPO_TOKEN }}
          path: skills-repo
          commit-message: "Update skills from ${{ github.repository }}"
          title: "Update skills from ${{ github.event.repository.name }}"
          body: |
            This PR updates skills from the [${{ github.repository }}](${{ github.server_url }}/${{ github.repository }}) repository.

            **Source commit:** ${{ github.sha }}
            **Triggered by:** @${{ github.actor }}

            ---
            *This PR was automatically created by the [sync-skills workflow](${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync-skills.yml).*
          branch: update-${{ github.event.repository.name }}-skills
          delete-branch: true
          labels: |
            automated
            skills-update
